name: quick_share_row
description: >
  A ready-made row of per-channel share icons (WhatsApp, SMS, Facebook,
  Email, system share) plus a long-press popup variant, so you don't have
  to hand-wire url_launcher deep links every time a screen needs a share
  UI. Extracted from a production Flutter app's reviews and booking
  screens and generalized for any message/URL.
version: 0.1.2
homepage: https://www.azarrapps.com/our-products/quick-share-row
repository: https://github.com/jaysonbal/quick_share_row

# Shown in the carousel on the package's pub.dev listing page - these are
# packaged with the source (not runtime assets, so they don't need a
# `flutter: assets:` entry below; consuming apps never bundle them).
screenshots:
  - description: 'ShareButtonsRow - an inline row of channel icons on a card'
    path: assets/screenshot-row.png
  - description: 'showShareMenu() - the same row in a long-press popup'
    path: assets/screenshot-popup.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

# NOTE ON VERSION CONSTRAINTS: this sandbox has no network path to
# pub.dev (only npm/PyPI/crates/Go module registries are reachable), so
# these floors are deliberately conservative rather than pinned to
# "current" - I can't confirm current from here. Run `flutter pub get`
# once, then `flutter pub outdated` and tighten these to match what
# actually resolves before publishing.
dependencies:
  flutter:
    sdk: flutter
  share_plus: '>=10.0.0 <12.0.0'
  url_launcher: '>=6.1.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  # No assets/fonts of its own - every icon is a Material IconData or a
  # widget you supply yourself via ShareChannel.customChild, so consumers
  # never have to bundle this package's assets into their own app.
