name: quick_share_row
description: >-
  Ready-made per-channel share row (WhatsApp, SMS, Facebook, Email, system
  sheet) plus a long-press popup for Flutter, no deep-link wiring.
version: 0.1.4
homepage: https://www.azarrapps.com/our-products/quick-share-row
repository: https://github.com/jaysonbal/quick_share_row

# Shown in the carousel on the package's pub.dev listing page - these are
# packaged with the source (not runtime assets, so they don't need a
# `flutter: assets:` entry below; consuming apps never bundle them).
screenshots:
  - description: 'ShareButtonsRow - an inline row of channel icons on a card'
    path: assets/screenshot-row.png
  - description: 'showShareMenu() - the same row in a long-press popup'
    path: assets/screenshot-popup.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

# share_plus floor verified against its own changelog: SharePlus.instance /
# ShareParams (used in lib/src/share_utils.dart) were introduced in 11.0.0,
# not 10.0.0 - pub.dev's lower-bound downgrade check caught that a 10.0.0
# floor was wrong (those identifiers don't exist at exactly 10.0.0). Upper
# bound widened to <13.0.0 in 0.1.4: share_plus 12.0.0's breaking changes
# were Android/Gradle build-tooling only (AGP/Gradle/Kotlin minimums), not
# an API change, so consuming apps already on share_plus ^12.0.1 aren't
# blocked from depending on this package.
dependencies:
  flutter:
    sdk: flutter
  share_plus: '>=11.0.0 <13.0.0'
  url_launcher: '>=6.1.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  # No assets/fonts of its own - every icon is a Material IconData or a
  # widget you supply yourself via ShareChannel.customChild, so consumers
  # never have to bundle this package's assets into their own app.
